services:
  integration-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: cloudstack-bluefield-integration:local
    platform: linux/arm64
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: "8081"
      LOG_LEVEL: INFO
      ESWITCH_ADAPTER_MODE: ${ESWITCH_ADAPTER_MODE:-mock}
      ESWITCHCTL_PATH: /usr/local/bin/eswitchctl
      INTEGRATION_API_TOKEN: ${INTEGRATION_API_TOKEN:?INTEGRATION_API_TOKEN must be set}
      ESWITCHCTL_TIMEOUT_SECONDS: "10"
    ports:
      - "${INTEGRATION_API_BIND_ADDRESS:-127.0.0.1}:8081:8081"
    volumes:
      - type: bind
        source: /usr/local/bin/eswitchctl
        target: /usr/local/bin/eswitchctl
        read_only: true
      - type: bind
        source: /run/eswitch-management
        target: /run/eswitch-management
        read_only: true
    group_add:
      - "0"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    restart: unless-stopped
